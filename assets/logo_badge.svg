<svg xmlns="http://www.w3.org/2000/svg" width="220" height="44" viewBox="0 0 220 44" role="img" aria-label="Vinod Bavage brand badge">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700&amp;display=swap');
      .badge-text {
        font-family: 'Syne', 'Arial Black', sans-serif;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.03em;
        fill: #FFFFFF;
      }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2D9CDB"/>
      <stop offset="100%" stop-color="#1A7FC1"/>
    </linearGradient>
  </defs>

  <!-- Badge background — pill shape -->
  <rect x="0" y="0" width="220" height="44" rx="22" ry="22" fill="url(#badgeGrad)" filter="url(#glow)"/>

  <!-- Subtle inner border -->
  <rect x="1" y="1" width="218" height="42" rx="21" ry="21" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Author name text -->
  <text x="110" y="27.5" text-anchor="middle" class="badge-text">Vinod Bavage</text>
</svg>
